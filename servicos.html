<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bravus Barber - Serviços</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .header-page { 
            padding: 30px 20px 20px 20px; 
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .title { 
            font-size: 28px; 
            font-weight: 900; 
            line-height: 1.1; 
        }
        .ver-todos {
            color: var(--gold);
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
        }

        .lista-servicos { 
            padding: 0 20px 90px 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }

        .card-servico { 
            background-color: var(--card-bg); 
            border-radius: 16px; 
            padding: 15px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
        }
        
        .icone-box {
            background-color: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            min-width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .info-servico {
            flex: 1;
            margin: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .info-servico h3 { 
            font-size: 16px; 
            font-weight: 800; 
            margin: 0; 
        }
        .info-servico p { 
            color: var(--text-gray); 
            font-size: 12px; 
            margin: 0; 
        }
        .preco {
            color: var(--gold);
            font-weight: 900;
            font-size: 14px;
            margin-top: 2px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-outline:active {
            background-color: rgba(212, 175, 55, 0.1);
        }

        /* Animação do Skeleton (Carregamento) */
        @keyframes skeleton-pulse {
            0% { background-color: #2a2a2c; }
            50% { background-color: #3d3d40; }
            100% { background-color: #2a2a2c; }
        }
        .skeleton-card {
            background-color: var(--card-bg); 
            border-radius: 12px; 
            padding: 18px;
            border-left: 4px solid #2a2a2c; 
            margin-bottom: 15px;
        }
        .skeleton-line {
            height: 14px; 
            border-radius: 6px; 
            animation: skeleton-pulse 1.5s infinite ease-in-out; 
            margin-bottom: 10px;
        }
        .skeleton-line.title { width: 50%; height: 20px; margin-bottom: 15px; }
        .skeleton-line.text { width: 90%; }
        .skeleton-line.short { width: 40%; margin-bottom: 0; }
        
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Conecta o aplicativo PWA -->
    <link rel="manifest" href="manifest.json">
    <!-- Pinta a barra de bateria/sinal do celular do cliente de dourado -->
    <meta name="theme-color" content="#d4af37">

</head>
<body>

    <div class="header-page">
        <h1 class="title">Serviços em<br>destaque</h1>
        <a href="#" class="ver-todos">Ver todos</a>
    </div>

    <div id="mensagem-servicos" style="padding: 0 20px;"></div>

    <div class="lista-servicos" id="lista-servicos">
        <!-- Cards de serviços inseridos dinamicamente -->
    </div>

    <!-- Menu Inferior Fixo -->
    <nav class="bottom-nav">
        <a href="inicio.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>Início</span>
        </a>
        <a href="servicos.html" class="nav-item active">
            <span class="nav-icon">✂️</span>
            <span>Serviços</span>
        </a>
        <a href="painel-cliente.html" class="nav-item">
            <span class="nav-icon">📅</span>
            <span>Agenda</span>
        </a>
        <a href="perfil.html" class="nav-item">
            <span class="nav-icon">👤</span>
            <span>Perfil</span>
        </a>
    </nav>

    <script>
        async function carregarCatalogo() {
            const lista = document.getElementById('lista-servicos');
            const mensagem = document.getElementById('mensagem-servicos');

            try {
                const resposta = await fetch('https://bravus-api.onrender.com/api/servicos');
                const servicos = await resposta.json();

                if (resposta.ok) {
                    lista.innerHTML = ''; 

                    servicos.forEach(item => {
                        const valor = parseFloat(item.preco).toFixed(2).replace('.', ',');
                        
                        // Lógica simples para mudar o ícone dependendo do nome do serviço
                        let icone = '✂️';
                        if (item.nome.toLowerCase().includes('barba')) icone = '✨';
                        if (item.nome.toLowerCase().includes('barboterapia')) icone = '👤';

                        lista.innerHTML += `
                            <div class="card-servico">
                                <div class="icone-box">${icone}</div>
                                <div class="info-servico">
                                    <h3>${item.nome}</h3>
                                    <p>${item.duracao_minutos} min • a partir de</p>
                                    <div class="preco">R$ ${valor}</div>
                                </div>
                                <button class="btn-outline" onclick="iniciarAgendamento(${item.id})">Agendar</button>
                            </div>
                        `;
                    });
                } else {
                    mensagem.style.color = 'var(--danger-red)';
                    mensagem.innerText = 'Falha ao carregar catálogo.';
                }
            } catch (erro) {
                console.error(erro);
                mensagem.style.color = 'var(--danger-red)';
                mensagem.innerText = 'Erro ao conectar com o servidor.';
            }
        }

        // Esta função pode redirecionar para a tela de agendamento levando o ID do serviço na URL
        function iniciarAgendamento(idServico) {
            // Em uma evolução futura, o agendamento.html poderá ler esse parâmetro da URL
            window.location.href = `agendamento.html?servico=${idServico}`;
        }

        window.onload = carregarCatalogo;
    </script>
</body>
</html>
